services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      CONNECTAUTO_SECURITY_JWT_SECRET: ${CONNECTAUTO_SECURITY_JWT_SECRET}
      CONNECTAUTO_SECURITY_ADMIN_EMAIL: ${CONNECTAUTO_SECURITY_ADMIN_EMAIL}
      CONNECTAUTO_SECURITY_ADMIN_PASSWORD: ${CONNECTAUTO_SECURITY_ADMIN_PASSWORD}
      CONNECTAUTO_CORS_ALLOWED_ORIGINS: http://localhost:5173

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
