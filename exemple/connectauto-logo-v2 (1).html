<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConnectAuto — Logo v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0B;
    --red:#E31C3D;
    --red-deep:#A3132B;
    --white:#F5F5F5;
    --grey:#9A9A9E;
    --border:#2C2C2F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:#0A0A0B; font-family:'Space Grotesk', sans-serif; padding:48px 24px; color:var(--white); }
  h1{ font-size:15px; font-weight:500; color:var(--grey); text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; text-align:center; }
  p.sub{ text-align:center; color:var(--grey); font-size:13px; margin-bottom:32px; }

  .sheet{ max-width:1000px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .card{ border-radius:18px; padding:44px; display:flex; align-items:center; justify-content:center; min-height:210px; position:relative; overflow:hidden; }
  .card .tag{ position:absolute; bottom:14px; left:18px; font-size:11px; opacity:.5; letter-spacing:1px; text-transform:uppercase; font-weight:500; }

  .on-black{ background:var(--black); border:1px solid var(--border); }
  .on-white{ background:#EFEFEF; color:#0A0A0B; }
  .on-red{ background:var(--red); }

  .lockup{ display:flex; align-items:center; gap:18px; }
  .wordmark{ font-weight:700; font-size:27px; letter-spacing:-.2px; white-space:nowrap; }
  .wordmark .auto{ color:var(--red); }
  .on-red .wordmark .connect{ color:var(--black); }
  .on-red .wordmark .auto{ color:var(--white); }

  .full-row{ grid-column:1 / -1; }
</style>
</head>
<body>

<h1>ConnectAuto — marca</h1>
<p class="sub">Pino de localização + silhueta de veículo — a rede de concessionárias e a frota, num só símbolo</p>

<div class="sheet">

  <div class="card on-black full-row">
    <div class="lockup">
      <svg width="70" height="70" viewBox="0 0 100 128">
        <path d="M50,4 C75,4 94,23 94,48 C94,78 50,122 50,122 C50,122 6,78 6,48 C6,23 25,4 50,4 Z" fill="var(--red)"/>
        <circle cx="50" cy="47" r="30" fill="var(--black)"/>
        <g transform="translate(35,33) scale(1.25)" stroke="var(--white)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 13l1.5-5a2 2 0 0 1 2-1.4h11a2 2 0 0 1 2 1.4L21 13"/>
          <path d="M3 13h18v4a1 1 0 0 1-1 1h-1.4a1 1 0 0 1-1-1v-.7h-11v.7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
          <circle cx="7.5" cy="16.3" r="1.5" fill="var(--white)"/>
          <circle cx="16.5" cy="16.3" r="1.5" fill="var(--white)"/>
        </g>
      </svg>
      <div class="wordmark"><span class="connect" style="color:var(--white)">Connect</span><span class="auto">Auto</span></div>
    </div>
    <span class="tag" style="color:var(--white)">Lockup primário · fundo escuro</span>
  </div>

  <div class="card on-white">
    <div class="lockup">
      <svg width="60" height="60" viewBox="0 0 100 128">
        <path d="M50,4 C75,4 94,23 94,48 C94,78 50,122 50,122 C50,122 6,78 6,48 C6,23 25,4 50,4 Z" fill="var(--red)"/>
        <circle cx="50" cy="47" r="30" fill="#0A0A0B"/>
        <g transform="translate(35,33) scale(1.25)" stroke="#F5F5F5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 13l1.5-5a2 2 0 0 1 2-1.4h11a2 2 0 0 1 2 1.4L21 13"/>
          <path d="M3 13h18v4a1 1 0 0 1-1 1h-1.4a1 1 0 0 1-1-1v-.7h-11v.7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
          <circle cx="7.5" cy="16.3" r="1.5" fill="#F5F5F5"/>
          <circle cx="16.5" cy="16.3" r="1.5" fill="#F5F5F5"/>
        </g>
      </svg>
      <div class="wordmark"><span class="connect" style="color:#0A0A0B">Connect</span><span class="auto">Auto</span></div>
    </div>
    <span class="tag">Fundo claro</span>
  </div>

  <div class="card on-red">
    <div class="lockup">
      <svg width="60" height="60" viewBox="0 0 100 128">
        <path d="M50,4 C75,4 94,23 94,48 C94,78 50,122 50,122 C50,122 6,78 6,48 C6,23 25,4 50,4 Z" fill="var(--black)"/>
        <circle cx="50" cy="47" r="30" fill="var(--red)"/>
        <g transform="translate(35,33) scale(1.25)" stroke="var(--white)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 13l1.5-5a2 2 0 0 1 2-1.4h11a2 2 0 0 1 2 1.4L21 13"/>
          <path d="M3 13h18v4a1 1 0 0 1-1 1h-1.4a1 1 0 0 1-1-1v-.7h-11v.7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
          <circle cx="7.5" cy="16.3" r="1.5" fill="var(--white)"/>
          <circle cx="16.5" cy="16.3" r="1.5" fill="var(--white)"/>
        </g>
      </svg>
      <div class="wordmark"><span class="connect">Connect</span><span class="auto">Auto</span></div>
    </div>
    <span class="tag" style="color:var(--black)">Aplicação sobre vermelho</span>
  </div>

  <div class="card on-black">
    <svg width="140" height="176" viewBox="0 0 100 128">
      <path d="M50,4 C75,4 94,23 94,48 C94,78 50,122 50,122 C50,122 6,78 6,48 C6,23 25,4 50,4 Z" fill="var(--red)"/>
      <circle cx="50" cy="47" r="30" fill="var(--black)"/>
      <g transform="translate(35,33) scale(1.25)" stroke="var(--white)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13l1.5-5a2 2 0 0 1 2-1.4h11a2 2 0 0 1 2 1.4L21 13"/>
        <path d="M3 13h18v4a1 1 0 0 1-1 1h-1.4a1 1 0 0 1-1-1v-.7h-11v.7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
        <circle cx="7.5" cy="16.3" r="1.5" fill="var(--white)"/>
        <circle cx="16.5" cy="16.3" r="1.5" fill="var(--white)"/>
      </g>
    </svg>
    <span class="tag" style="color:var(--white)">Ícone isolado · app icon / favicon</span>
  </div>

  <div class="card on-white">
    <svg width="140" height="176" viewBox="0 0 100 128">
      <path d="M50,4 C75,4 94,23 94,48 C94,78 50,122 50,122 C50,122 6,78 6,48 C6,23 25,4 50,4 Z" fill="var(--red)"/>
      <circle cx="50" cy="47" r="30" fill="#0A0A0B"/>
      <g transform="translate(35,33) scale(1.25)" stroke="#F5F5F5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13l1.5-5a2 2 0 0 1 2-1.4h11a2 2 0 0 1 2 1.4L21 13"/>
        <path d="M3 13h18v4a1 1 0 0 1-1 1h-1.4a1 1 0 0 1-1-1v-.7h-11v.7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
        <circle cx="7.5" cy="16.3" r="1.5" fill="#F5F5F5"/>
        <circle cx="16.5" cy="16.3" r="1.5" fill="#F5F5F5"/>
      </g>
    </svg>
    <span class="tag">Ícone sobre fundo claro</span>
  </div>

</div>

</body>
</html>
