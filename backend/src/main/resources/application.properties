spring.application.name=connectauto

# Datasource (H2 em memoria)
spring.datasource.url=jdbc:h2:mem:connectauto
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HTTP client (RestClient) — evita que uma chamada externa lenta/travada (ex.: ViaCEP)
# prenda a thread da requisicao indefinidamente e esgote o pool sob carga.
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=5s

# CORS - origens do frontend autorizadas a chamar a API (separadas por virgula)
connectauto.cors.allowed-origins=http://localhost:5173

# Autenticacao (JWT) - valores de desenvolvimento; sobrescreva via variavel de
# ambiente (ex.: CONNECTAUTO_SECURITY_ADMIN_PASSWORD) antes de qualquer deploy real.
connectauto.security.jwt-secret=E9o/mGLlvhuJRmV4Z4xdUpfBykCAkpkS33kAKxB0OlWVu6c6tVb1wsCsh5HgOikjBMUcbCRuEWhhfIh3yApXzA==
connectauto.security.jwt-expiration=8h
connectauto.security.admin-email=admin@connectauto.com.br
connectauto.security.admin-password=connectauto123

# Logging
# Padrao de niveis adotado no projeto 
logging.level.root=INFO
logging.level.com.acc.connectauto=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{36}] - %msg%n
